apiVersion: apps/v1
kind: Deployment 
metadata: 
  name: frontend
  namespace: production
  labels:
    app: frontend
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels: 
        app: frontend
    spec:
      containers:
        - name: frontend
          image: cloudacademydevops/frontend:v11
          imagePullPolicy: Always
          env:
            - name: REACT_APP_APIHOSTPORT
              value: $API_ELB_PUBLIC_FQDN  #add your API_Load_Balancer DNS manually here if app does not run
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /ok
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ok
              port: 8080
            initialDelayseconds: 5
            periodSeconds: 10
            successThreshold: 1